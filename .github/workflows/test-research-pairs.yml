name: Test paired research comparisons
on:
  push:
    branches:
      - feature/ban-giao-mh-md-theo-lop-20261118
  workflow_dispatch:
jobs:
  research-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest beautifulsoup4
      - name: Research comparison tests (including Flask end-to-end)
        run: python -m pytest -q -v tests/test_research_comparison_pairs.py
      - name: Research page with PostgreSQL (Render-compatible)
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_test
        run: python -m pytest -q -v tests/test_research_comparison_pairs.py -k test_flask_role_workflow_and_legacy_schema
      - name: Video selection across all filtered pages
        run: python -m pytest -q -v tests/test_video_selection_across_pages.py
      - name: Lecturer usage analytics and 5-row pagination
        run: python -m pytest -q -v tests/test_lecturer_usage_analytics.py
      - name: QR measurement classification by actual download style
        run: python -m pytest -q -v tests/test_qr_auto_classification.py
      - name: Web App measured first, manual counterpart entered afterward
        run: python -m pytest -q -v tests/test_qr_webapp_before_manual.py
      - name: Google YouTube consent gate and KPI audit
        run: python -m pytest -q -v tests/test_youtube_permission_gate.py
      - name: Check browser operation-counter JavaScript syntax
        run: |
          node --check static/research_measurement.js
          node --check static/video_selection.js
          node --check static/library_filter_reset.js
      - name: Regression bulk playlist tests
        run: |
          python tests/test_v4329_bulk_playlist_actions.py
          python tests/test_v4330_bulk_ui_profile_cleanup.py
