name: Test paired research comparisons
on:
  push:
    branches:
      - feature/ban-giao-mh-md-theo-lop-20261118
  workflow_dispatch:
jobs:
  research-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest beautifulsoup4
      - name: Research comparison tests
        run: python -m pytest -q tests/test_research_comparison_pairs.py
      - name: Regression bulk playlist tests
        run: python -m pytest -q tests/test_v4329_bulk_playlist_actions.py tests/test_v4330_bulk_ui_profile_cleanup.py
