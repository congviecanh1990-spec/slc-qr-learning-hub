services:
  - type: web
    name: slc-qr-learning-hub
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slc-qr-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RECONCILE_KEY
        generateValue: true
      - key: COMPLETION_THRESHOLD
        value: "0.95"
      - key: HEARTBEAT_SECONDS
        value: "5"
      - key: COOKIE_SECURE
        value: "1"
      - key: AUTO_CREATE_DB
        value: "1"

databases:
  - name: slc-qr-db
    plan: free
    region: singapore
