{% extends 'base.html' %}
{% block content %}<h2>Nhật ký lỗi</h2><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Thời gian</th><th>Mô-đun</th><th>Thông báo</th><th>Chi tiết</th></tr></thead><tbody>{% for e in logs %}<tr><td>{{ e.created_at }}</td><td>{{ e.module }}</td><td>{{ e.message }}</td><td><details><summary>Xem</summary><pre class="small text-wrap">{{ e.details }}</pre></details></td></tr>{% else %}<tr><td colspan="4" class="text-muted text-center">Chưa có lỗi.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
