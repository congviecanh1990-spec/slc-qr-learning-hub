<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhận diện người dùng</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body class="viewer-bg"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow"><div class="card-body p-4"><h3>Nhận diện GV/SV</h3><p class="text-muted">Chỉ nhập mã định danh phục vụ nghiên cứu; hệ thống không yêu cầu họ tên.</p><form method="post" action="{{ url_for('identify') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Mã GV/SV</label><input class="form-control mb-3" name="participant_code" required autofocus><label class="form-label">Vai trò</label><select class="form-select mb-3" name="role"><option value="SV">Sinh viên</option><option value="GV">Giảng viên</option></select><label class="form-label">Lớp</label><select class="form-select mb-3" name="class_code"><option value="">— Chọn/không xác định —</option>{% for c in classes %}<option value="{{ c.code }}">{{ c.code }} — {{ c.name }}</option>{% endfor %}</select><button class="btn btn-primary w-100">Tiếp tục xem học liệu</button></form></div></div></div></div></div></body></html>
