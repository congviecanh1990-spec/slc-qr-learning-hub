<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Truy cập học liệu - {{ school_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="viewer-bg">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="text-center mb-3">
            <img class="identify-logo" src="{{ url_for('static', filename=brand_logo) }}" alt="Logo {{ school_name }}">
            <div class="fw-bold mt-2">{{ school_name }}</div>
          </div>
          <h3>Truy cập học liệu</h3>
          <p class="text-muted">Bạn đang truy cập học liệu bằng mã QR do giảng viên cung cấp. <strong>Không cần đăng nhập Web App.</strong> Vui lòng nhập mã sinh viên và chọn lớp để hệ thống ghi nhận việc khai thác học liệu. Không yêu cầu nhập họ tên.</p>
          <form method="post" action="{{ url_for('identify') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label fw-bold">Mã sinh viên</label>
            <input class="form-control mb-3" name="participant_code" required autofocus placeholder="Nhập mã sinh viên">
            <label class="form-label fw-bold">Lớp</label>
            <select class="form-select mb-3" name="class_code">
              <option value="">— Chọn/không xác định —</option>
              {% for c in classes %}<option value="{{ c.code }}">{{ c.name }}</option>{% endfor %}
            </select>
            <button class="btn btn-primary w-100">Tiếp tục xem học liệu</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
