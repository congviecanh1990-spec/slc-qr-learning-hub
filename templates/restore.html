{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><h2>Khôi phục dữ liệu</h2><div class="alert alert-warning"><b>Cảnh báo:</b> thao tác này thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong bản sao lưu. Chỉ dùng tệp do chính hệ thống này tạo.</div><form method="post" enctype="multipart/form-data" class="card card-body shadow-sm"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Tệp sao lưu ZIP</label><input type="file" class="form-control mb-3" name="backup_file" accept=".zip" required><label class="form-label">Nhập <code>RESTORE</code> để xác nhận</label><input class="form-control mb-3" name="confirm" autocomplete="off" required><button class="btn btn-danger">Khôi phục dữ liệu</button></form></div></div>
{% endblock %}
